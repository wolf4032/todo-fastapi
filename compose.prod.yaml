# 本番相当の差分。compose.override.yaml と違い自動では読まれないので、
#   docker compose -f compose.yaml -f compose.prod.yaml ...
# と明示指定する。-f を1つでも書くと compose.override.yaml は読まれなくなるため、
# devtools・バインドマウント・--reload はこの構成には一切現れない。
# → docs/notes/step-11-prod-image.md
services:
  api:
    build:
      target: prod
    # volumes も command も書かない。
    # コードはイメージに焼かれた app/ だけが動き、起動コマンドは Dockerfile の CMD
    # （--reload なし）がそのまま使われる。実行ユーザーも Dockerfile の USER app（非 root）。
    ports:
      # 127.0.0.1 に限定し、そのマシンの中からしか繋がらないようにする。
      # 公開サーバーでも API は外に出さず、ブラウザからは web の中継を通す（ADR 0005）。
      - "127.0.0.1:8000:8000"

  web:
    build:
      target: prod
    # api と同じく volumes も command も書かない。standalone の server.js を非 root で動かす。
    # api への中継先（http://api:8000）は next build の時点でイメージに焼かれている。
    ports:
      # 左（ホスト側）の番号は .env の WEB_PORT で変えられる。未設定なら 3000。
      # 公開サーバーでは 80 にして、http://<IP> だけで開けるようにする。
      - "${WEB_PORT:-3000}:3000"
