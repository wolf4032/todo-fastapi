# 全環境で共通の定義。
# compose.override.yaml（開発差分・自動で読まれる）と
# compose.prod.yaml（本番相当・-f で明示指定）を重ねて使う。
# → docs/notes/step-02-devcontainer.md
name: todo-fastapi

# 開発専用の devtools は本番の構成に混ぜたくないので compose.override.yaml 側に置く。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # DB の実データは名前付きボリュームに載せ、コンテナを作り直しても残るようにする。
      # → docs/notes/topic-docker-volumes.md
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # DB プロセスが起動しているだけでなく、接続を受け付けられる状態かまで確認する。
      # api の depends_on の condition: service_healthy から使う。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      # コンテキストを ./backend に絞る。Docker デーモンに送られるファイルも
      # COPY の起点も backend/ 配下だけになり、ルートの compose や .devcontainer/ は
      # イメージから見えない。→ docs/notes/step-04-backend-container.md
      context: ./backend
    environment:
      # ホスト名・ポートは compose のサービス名 db がそのまま名前解決できるため
      # Settings 側の既定値（db:5432）に任せ、ここでは認証情報だけを渡す。
      # → docs/notes/step-05-app-foundation.md
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        # db が「起動している」だけでなく「接続を受け付けられる」状態になってから
        # api を起動する。→ docs/notes/step-03-postgres.md
        condition: service_healthy

  web:
    build:
      # api と同じく、コンテキストを ./frontend に絞る。
      context: ./frontend
    # ブラウザからの /api/... は web が api へ中継する（frontend/next.config.ts）。
    # 起動に api は要らないが、docker compose up web だけで api も立つようにしておく。
    depends_on:
      - api

volumes:
  pgdata:
