# 開発時だけの差分。この名前なら docker compose が自動で読み込み、compose.yaml にマージする。
services:
  # VS Code (Dev Container) が接続する開発用ツールボックス。
  # アプリを動かすコンテナではないため、共通定義には置かない。
  devtools:
    build:
      # コンテキストを .devcontainer に絞り、Docker に送るファイルを最小限にする。
      context: .devcontainer
      dockerfile: Dockerfile
    # devtools に常駐プロセスは無いため、これが無いと起動直後に終了してしまう。
    command: sleep infinity
    volumes:
      # .git ごとマウントされるので、コンテナ内でも git がそのまま使える。
      # マウント先を /workspaces 直下ではなく /workspaces/<リポジトリ名> にするのは
      # Dev Containers の慣習で、将来別リポジトリを同時に開くときの衝突も避けられる。
      - .:/workspaces/todo-fastapi
      # Claude Code の認証情報・設定・セッション履歴の保存先。
      # コンテナを作り直しても消えないよう名前付きボリュームに載せる。
      - claude-config:/home/vscode/.claude
      # バインドマウントの内側を、名前付きボリュームで上書きする。
      # node_modules はファイル数が桁違いに多く、ホスト（macOS）と同期させると遅い。
      # ホスト側には中身の無い frontend/node_modules ディレクトリだけが現れる。
      # 中身は postCreateCommand の npm ci で入れる。
      - frontend-node-modules:/workspaces/todo-fastapi/frontend/node_modules
    environment:
      # ~/.claude.json（OAuth アカウント情報）は既定では ~/.claude の外に置かれるため、
      # 保存先を明示しないとリビルドのたびに再ログインが必要になる。
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    working_dir: /workspaces/todo-fastapi

  api:
    build:
      # Dockerfile は5段構成だが、開発ではここで dev ステージだけをビルドする。
      target: dev
    volumes:
      # dev ステージはコードを COPY していないので、バインドマウントで補う。
      # 保存した変更がコンテナ内に即反映される（--reload と組み合わせて自動リロード）。
      - ./backend:/app
    ports:
      - "8000:8000"
      # デバッガ（debugpy）用。Step 5 で使う。
      - "5678:5678"
    # --reload はファイル変更を監視して自動再起動する開発専用のオプション。
    # 本番では余計な監視プロセスが常駐するだけで無意味なため、
    # イメージの CMD には焼き込まずここで指定する。
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      target: dev
    volumes:
      # api の ./backend:/app と同じく、保存した変更をコンテナに即反映させる。
      - ./frontend:/app
      # バインドマウントで /app ごと覆うと、イメージに npm ci で入れた node_modules も
      # 隠れてしまう。その上に匿名ボリュームを重ねて、イメージ側の中身を見せる。
      # 依存を変えたら --build と -V（--renew-anon-volumes）で作り直す。
      # → docs/notes/step-14-web-container.md
      - /app/node_modules
      # next dev のビルドキャッシュ。ホストと同期させると遅く、ホスト側に残す理由も無い。
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  claude-config:
  frontend-node-modules:
